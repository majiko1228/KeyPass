<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyPass - 首页</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <div class="app" id="app">
    <section class="lock-screen hidden" id="lockScreen">
      <div class="lock-card">
        <div class="brand-mark">K</div>
        <div>
          <p class="eyebrow">账号密码管理</p>
          <h1>KeyPass</h1>
          <p class="muted">本地账号密码管理工作台。</p>
        </div>
        <form class="unlock-form" id="unlockForm">
          <label>
            主密码
            <input id="masterPassword" type="password" autocomplete="current-password" placeholder="keyPass-demo">
          </label>
          <button class="primary" type="submit">进入密码库</button>
          <p class="form-note" id="unlockHint">演示密码：<span>keyPass-demo</span></p>
        </form>
      </div>
    </section>

    <div class="shell" id="shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">导航</p>
          <h2>密码库</h2>
        </div>
        <nav class="nav" id="nav">
          <button class="nav-item active" data-view="vault">全部账号</button>
          <button class="nav-item" data-view="favorites">收藏账号</button>
          <button class="nav-item" data-view="trash">回收站</button>
          <button class="nav-item" data-view="settings">设置</button>
        </nav>

        <section class="sidebar-section">
          <div class="section-head">
            <p>标签</p>
            <button class="ghost tiny" id="clearTagFilter" type="button">清除</button>
          </div>
          <div class="tag-list" id="tagList"></div>
        </section>

        <section class="sidebar-section stats">
          <div>
            <span class="stat-value" id="entryCount">0</span>
            <span class="stat-label">账号</span>
          </div>
          <div>
            <span class="stat-value" id="favoriteCount">0</span>
            <span class="stat-label">收藏</span>
          </div>
          <div>
            <span class="stat-value" id="trashCount">0</span>
            <span class="stat-label">回收站</span>
          </div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="viewLabel">全部账号</p>
            <h2 id="viewTitle">账号密码库</h2>
          </div>
          <div class="topbar-actions">
            <div class="search-shell">
              <input id="searchInput" type="search" placeholder="搜索名称、用户名、网址或标签">
            </div>
            <button class="primary" id="newEntryButton" type="button">新增账号</button>
            <button class="ghost" id="lockButton" type="button">退出登录</button>
          </div>
        </header>

        <section class="workspace" id="vaultView">
          <div class="panel list-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">账号列表</p>
                <h3>已保存账号</h3>
              </div>
              <span class="pill" id="filteredCount">显示 0 项</span>
            </div>
            <div class="entry-list" id="entryList"></div>
          </div>

          <div class="panel detail-panel" id="detailPanel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">账号详情</p>
                <h3>信息预览</h3>
              </div>
              <div class="panel-actions">
                <button class="ghost tiny" id="copyUsernameButton" type="button">复制用户名</button>
                <button class="ghost tiny" id="copyPasswordButton" type="button">复制密码</button>
              </div>
            </div>
            <div class="detail-empty" id="detailEmpty">
              <p>请选择一个账号查看详情。</p>
            </div>
            <article class="detail-card hidden" id="detailCard">
              <div class="detail-title-row">
                <div>
                  <h3 id="detailTitle"></h3>
                  <p class="muted" id="detailUrl"></p>
                </div>
                <button class="icon-button" id="favoriteButton" type="button" aria-label="切换收藏">★</button>
              </div>

              <dl class="detail-grid">
                <div>
                  <dt>用户名</dt>
                  <dd id="detailUsername"></dd>
                </div>
                <div>
                  <dt>密码</dt>
                  <dd id="detailPassword"></dd>
                </div>
                <div>
                  <dt>标签</dt>
                  <dd id="detailTags"></dd>
                </div>
                <div class="detail-wide">
                  <dt>备注</dt>
                  <dd id="detailNotes"></dd>
                </div>
              </dl>

              <div class="detail-actions">
                <button class="primary" id="editEntryButton" type="button">编辑</button>
                <button class="ghost" id="deleteEntryButton" type="button">移至回收站</button>
                <button class="ghost" id="generatePasswordButton" type="button">生成密码</button>
              </div>
            </article>
          </div>
        </section>

        <section class="view-panel hidden" id="trashView">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">恢复管理</p>
              <h3>回收站</h3>
            </div>
            <span class="pill" id="trashShownCount">0 项</span>
          </div>
          <div class="table" id="trashList"></div>
        </section>

        <section class="view-panel hidden" id="settingsView">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">偏好设置</p>
              <h3>设置</h3>
            </div>
            <span class="pill">本地演示</span>
          </div>

          <div class="settings-grid">
            <section class="panel settings-panel">
              <h4>安全设置</h4>
              <label>
                主密码
                <input id="masterPasswordSetting" type="text" placeholder="keyPass-demo">
              </label>
              <label>
                自动锁定时间
                <select id="autoLockSetting">
                  <option value="1">1 分钟</option>
                  <option value="3">3 分钟</option>
                  <option value="5">5 分钟</option>
                  <option value="10">10 分钟</option>
                </select>
              </label>
              <button class="primary" id="saveSecurityButton" type="button">保存安全设置</button>
            </section>

            <section class="panel settings-panel">
              <h4>备份与恢复</h4>
              <div class="button-row">
                <button class="ghost" id="exportButton" type="button">导出 JSON</button>
                <label class="ghost file-button" for="importInput">导入 JSON</label>
                <input id="importInput" type="file" accept="application/json">
              </div>
              <p class="muted">导入会替换当前本地演示数据。</p>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="overlay hidden" id="entryModal">
      <div class="modal">
        <div class="panel-head compact">
          <div>
            <p class="eyebrow" id="entryModalEyebrow">新增账号</p>
            <h3 id="entryModalTitle">添加账号</h3>
          </div>
          <button class="icon-button" data-close="entryModal" type="button" aria-label="关闭弹窗">×</button>
        </div>

        <form id="entryForm" class="form-grid">
          <input type="hidden" id="entryId" name="id">
          <label>
            名称
            <input id="entryTitle" name="title" required maxlength="80" placeholder="GitHub">
          </label>
          <label>
            用户名
            <input id="entryUsername" name="username" required maxlength="120" placeholder="majiko1228">
          </label>
          <label>
            密码
            <input id="entryPassword" name="password" required maxlength="160" placeholder="••••••••">
          </label>
          <label>
            网址
            <input id="entryUrl" name="url" maxlength="200" placeholder="https://github.com">
          </label>
          <label class="wide">
            标签
            <input id="entryTags" name="tags" maxlength="120" placeholder="工作、个人、社交">
          </label>
          <label class="wide">
            备注
            <textarea id="entryNotes" name="notes" rows="4" maxlength="400" placeholder="找回邮箱、双重验证提示等"></textarea>
          </label>
          <div class="button-row wide">
            <button class="ghost" id="openGeneratorFromForm" type="button">密码生成器</button>
            <button class="primary" type="submit">保存账号</button>
          </div>
        </form>
      </div>
    </div>

    <div class="overlay hidden" id="generatorModal">
      <div class="modal narrow">
        <div class="panel-head compact">
          <div>
            <p class="eyebrow">实用工具</p>
            <h3>密码生成器</h3>
          </div>
          <button class="icon-button" data-close="generatorModal" type="button" aria-label="关闭弹窗">×</button>
        </div>

        <div class="form-grid">
          <label>
            长度
            <input id="genLength" type="range" min="12" max="32" value="20">
          </label>
          <label>
            生成结果
            <input id="generatedPassword" readonly>
          </label>
          <div class="toggle-row">
            <label><input id="genUpper" type="checkbox" checked> 大写字母</label>
            <label><input id="genLower" type="checkbox" checked> 小写字母</label>
            <label><input id="genNumber" type="checkbox" checked> 数字</label>
            <label><input id="genSymbol" type="checkbox" checked> 符号</label>
          </div>
          <div class="button-row">
            <button class="ghost" id="copyGeneratedButton" type="button">复制</button>
            <button class="primary" id="generateButton" type="button">重新生成</button>
            <button class="ghost" id="fillPasswordButton" type="button">填入账号</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>
  </div>

  <script src="../assets/js/home.js"></script>
</body>
</html>
